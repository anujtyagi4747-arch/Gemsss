  background:var(--ivory);
  color:var(--ink);

  font-family:"DM Sans",sans-serif;

  overflow-x:hidden;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

body,
button,
input,
textarea,
select{

}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

button{

  cursor:pointer;
}

a{
  color:inherit;
}

img{
  display:block;
  max-width:100%;
}

iframe{
  display:block;

/* ---------------------------------------------------------
   SELECTION
   --------------------------------------------------------- */

::selection{

}


/* ---------------------------------------------------------
   SCROLLBAR
   --------------------------------------------------------- */

  width:7px;
}

::-webkit-scrollbar-track{

}

::-webkit-scrollbar-thumb{

  border-radius:20px;
}


/* ---------------------------------------------------------
   GLOBAL CONTAINER
   --------------------------------------------------------- */

.cg-container{
  width:min(
    calc(100% - 32px),
    var(--container)
  );

  margin-left:auto;
  margin-right:auto;
}


/* ---------------------------------------------------------
   TOP ANNOUNCEMENT BAR
   --------------------------------------------------------- */

.cg-topbar{

  position:relative;

  width:100%;

  min-height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:

  background:

      #f5dfaa 0%,
      #f7edcf 42%,
      #e5f0e9 100%

  font-size:9px;
  font-weight:700;

  letter-spacing:.16em;
  text-transform:uppercase;

  text-align:center;
}

.cg-topbar-dot{
  display:inline-block;

  width:5px;
  height:5px;

  margin:0 8px;

  border-radius:50%;

  background:var(--emerald);
}


/* ---------------------------------------------------------
   MAIN NAVIGATION
   --------------------------------------------------------- */

.cg-nav{

  position:sticky;
  top:0;

  z-index:1000;

  width:100%;

  background:
    rgba(255,255,255,.88);

  border-bottom:

}

.cg-nav-inner{

    calc(100% - 28px),

  display:flex;
  align-items:center;
  justify-content:space-between;

   LOGO
   --------------------------------------------------------- */

<script>

(function(){

  "use strict";


  /* -------------------------------------------------------
     MOBILE MENU STATE
     ------------------------------------------------------- */

  const menuButton =
    document.querySelector(".cg-menu-btn");


  if(menuButton){

    menuButton.addEventListener(
      "click",
      function(){

        const opened =
          menuButton.getAttribute(
            "aria-expanded"
          ) === "true";

        menuButton.setAttribute(
          "aria-expanded",
          String(!opened)
        );

      }
    );

  }


  /* -------------------------------------------------------
     PREVENT BROKEN HASH JUMPS
     ------------------------------------------------------- */

  document
    .querySelectorAll(
      'a[href^="#"]'
    )
    .forEach(function(link){

      link.addEventListener(
        "click",
        function(event){

          const id =
            link.getAttribute("href");

          if(
            !id ||
            id === "#" ||
            !document.querySelector(id)
          ){
            return;
          }

          event.preventDefault();

          document
            .querySelector(id)
            .scrollIntoView({
              behavior:"smooth",
              block:"start"
            });

        }
      );

    });

})();

</script>

  `;

  document.head.appendChild(style);


  /* ---------- HERO ---------- */

  const hero = document.createElement('section');

  hero.className = 'cg-hero';

  hero.id = 'cgHero';

  hero.innerHTML = `

    <div class="cg-hero-video">

      <div class="cg-video-fallback"></div>

      <iframe
        id="cgYouTubePlayer"
        title="Ceremonial Gems"
        src="https://www.youtube-nocookie.com/embed/NJ-e6tf4hrY?autoplay=1&mute=1&loop=1&playlist=NJ-e6tf4hrY&controls=0&playsinline=1&rel=0&enablejsapi=1"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>

    </div>

    <div class="cg-video-wash"></div>

    <button
      type="button"
      class="cg-video-play"
      id="cgVideoPlay"
      aria-label="Play gemstone video">
    </button>

    <div class="cg-floating-gem cg-gem-green"></div>
    <div class="cg-floating-gem cg-gem-yellow"></div>
    <div class="cg-floating-gem cg-gem-pink"></div>
    <div class="cg-floating-gem cg-gem-blue"></div>

    <div class="cg-hero-inner">

      <div class="cg-hero-kicker">
        <span class="cg-kicker-line"></span>
        NATURAL • RARE • TIMELESS
      </div>

      <h1>
        <span>Colour</span>
        <strong>Born From</strong>
        <em>Earth.</em>
      </h1>

      <p class="cg-hero-copy">
        Discover a vivid world of natural gemstones,
        exceptional colour and timeless character —
        carefully selected for those who see beauty differently.
      </p>

      <div class="cg-hero-actions">

        <a
          href="#collections"
          class="cg-btn cg-btn-primary">
          Explore Gemstones <span>↗</span>
        </a>

        <a
          href="#our-story"
          class="cg-btn cg-btn-outline">
          Our Story
        </a>

      </div>

      <div class="cg-hero-bottom">

        <div class="cg-hero-stat">
          <b>01</b>
          <span>Natural<br>Gemstones</span>
        </div>

        <div class="cg-hero-stat">
          <b>02</b>
          <span>Rare<br>Colours</span>
        </div>

        <div class="cg-hero-stat">
          <b>03</b>
          <span>Curated<br>Collections</span>
        </div>

      </div>

    </div>

    <div class="cg-scroll-indicator">
      <span>SCROLL TO EXPLORE</span>
      <i></i>
    </div>

  `;


  /* Put hero directly after navigation */

  const nav = document.querySelector('.cg-nav');

  if(nav){

    nav.insertAdjacentElement(
      'afterend',
      hero
    );

  }else{

    document.body.prepend(hero);

  }


  /* ---------- YOUTUBE API ---------- */

  let cgPlayer = null;

  let cgPlaying = false;

  const playButton =
    document.getElementById('cgVideoPlay');

  const iframe =
    document.getElementById('cgYouTubePlayer');


  function loadYouTubeAPI(){

    if(window.YT && window.YT.Player){

      createPlayer();

      return;

    }

    const old =
      document.querySelector(
        'script[data-cg-youtube-api]'
      );

    if(!old){

      const api =
        document.createElement('script');

      api.src =
        'https://www.youtube.com/iframe_api';

      api.async = true;

      api.dataset.cgYoutubeApi = 'true';

      document.head.appendChild(api);

    }

    const previous =
      window.onYouTubeIframeAPIReady;

    window.onYouTubeIframeAPIReady =
      function(){

        if(typeof previous === 'function'){
          previous();
        }

        createPlayer();

      };

  }


  function createPlayer(){

    if(cgPlayer || !window.YT){
      return;
    }

    try{

      cgPlayer =
        new YT.Player(
          'cgYouTubePlayer',
          {
            events:{
              onReady:function(event){

                try{

                  event.target.mute();

                  event.target.playVideo();

                }catch(e){}

              },

              onStateChange:function(event){

                if(
                  event.data ===
                  YT.PlayerState.PLAYING
                ){

                  cgPlaying = true;

                  playButton.classList.remove(
                    'active'
                  );

                }

                if(
                  event.data ===
                  YT.PlayerState.ENDED
                ){

                  try{
                    event.target.playVideo();
                  }catch(e){}

                }

              },

              onAutoplayBlocked:function(){

                cgPlaying = false;

                playButton.classList.add(
                  'active'
                );

              }
            },

            playerVars:{
              autoplay:1,
              mute:1,
              controls:0,
              loop:1,
              playlist:'NJ-e6tf4hrY',
              playsinline:1,
              rel:0
            }
          }
        );

    }catch(error){

      playButton.classList.add(
        'active'
      );

    }

  }


  /* ---------- MANUAL PLAY FALLBACK ---------- */

  playButton.addEventListener(
    'click',
    function(){

      if(!cgPlayer){
        loadYouTubeAPI();
        return;
      }

      try{

        cgPlayer.mute();

        cgPlayer.playVideo();

        playButton.classList.remove(
          'active'
        );

      }catch(error){}

    }
  );


  /* ---------- START VIDEO ---------- */

  loadYouTubeAPI();


})();
