  background:var(--ivory);
  color:var(--ink);

  font-family:"DM Sans",sans-serif;

  overflow-x:hidden;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

body,
button,
input,
textarea,
select{

}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

button{

  cursor:pointer;
}

a{
  color:inherit;
}

img{
  display:block;
  max-width:100%;
}

iframe{
  display:block;

/* ---------------------------------------------------------
   SELECTION
   --------------------------------------------------------- */

::selection{

}


/* ---------------------------------------------------------
   SCROLLBAR
   --------------------------------------------------------- */

  width:7px;
}

::-webkit-scrollbar-track{

}

::-webkit-scrollbar-thumb{

  border-radius:20px;
}


/* ---------------------------------------------------------
   GLOBAL CONTAINER
   --------------------------------------------------------- */

.cg-container{
  width:min(
    calc(100% - 32px),
    var(--container)
  );

  margin-left:auto;
  margin-right:auto;
}


/* ---------------------------------------------------------
   TOP ANNOUNCEMENT BAR
   --------------------------------------------------------- */

.cg-topbar{

  position:relative;

  width:100%;

  min-height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:

  background:

      #f5dfaa 0%,
      #f7edcf 42%,
      #e5f0e9 100%

  font-size:9px;
  font-weight:700;

  letter-spacing:.16em;
  text-transform:uppercase;

  text-align:center;
}

.cg-topbar-dot{
  display:inline-block;

  width:5px;
  height:5px;

  margin:0 8px;

  border-radius:50%;

  background:var(--emerald);
}


/* ---------------------------------------------------------
   MAIN NAVIGATION
   --------------------------------------------------------- */

.cg-nav{

  position:sticky;
  top:0;

  z-index:1000;

  width:100%;

  background:
    rgba(255,255,255,.88);

  border-bottom:

}

.cg-nav-inner{

    calc(100% - 28px),

  display:flex;
  align-items:center;
  justify-content:space-between;

   LOGO
   --------------------------------------------------------- */

<script>

(function(){

  "use strict";


  /* -------------------------------------------------------
     MOBILE MENU STATE
     ------------------------------------------------------- */

  const menuButton =
    document.querySelector(".cg-menu-btn");


  if(menuButton){

    menuButton.addEventListener(
      "click",
      function(){

        const opened =
          menuButton.getAttribute(
            "aria-expanded"
          ) === "true";

        menuButton.setAttribute(
          "aria-expanded",
          String(!opened)
        );

      }
    );

  }


  /* -------------------------------------------------------
     PREVENT BROKEN HASH JUMPS
     ------------------------------------------------------- */

  document
    .querySelectorAll(
      'a[href^="#"]'
    )
    .forEach(function(link){

      link.addEventListener(
        "click",
        function(event){

          const id =
            link.getAttribute("href");

          if(
            !id ||
            id === "#" ||
            !document.querySelector(id)
          ){
            return;
          }

          event.preventDefault();

          document
            .querySelector(id)
            .scrollIntoView({
              behavior:"smooth",
              block:"start"
            });

        }
      );

    });

})();

</script>

      pink:"radial-gradient(circle at 30% 20%,#ffe0ed 0%,#ff83b8 27%,#dc397b 58%,#68143d 100%)",
      purple:"radial-gradient(circle at 30% 20%,#e6d0ff 0%,#a875ff 28%,#6841c6 57%,#281354 100%)",
      opal:"radial-gradient(circle at 30% 20%,#fff 0%,#9df7e8 22%,#8caeff 42%,#ff8ed7 63%,#fff0a0 100%)",

    return `

  function render(list){

    grid.innerHTML = list.map(card).join("");

    if(count){

        list.length + (list.length === 1 ? " STONE" : " STONES");
    }

    bindCards();
  }

    document.querySelectorAll(".cg-product-heart").forEach(btn=>{

          : "Removed from wishlist"

      };
    });

    document.querySelectorAll(".cg-add-bag").forEach(btn=>{
      btn.onclick=function(){

        const p =
          products.find(x=>x.id===this.dataset.id);

        if(!p) return;

        this.textContent="Added ✓";

        toast(p.name + " added to your bag");

        setTimeout(()=>{
          this.textContent="Add to Bag";
        },1600);
      };
    });

    document.querySelectorAll(".cg-quick-view").forEach(btn=>{
      btn.onclick=function(){

        const p =
          products.find(x=>x.id===this.dataset.id);

        if(p){
          openQuickView(p);
        }
      };
    });

  }

  function toast(message){

    let t=document.getElementById("cgToast");

    if(!t){

      t.id="cgToast";

      t.innerHTML=`

        <span class="cg-toast-text"></span>
      `;

      document.body.appendChild(t);
    }

    t.querySelector(".cg-toast-text").textContent=message;

    t.classList.add("show");

    clearTimeout(window.cgToastTimer);

    window.cgToastTimer=setTimeout(()=>{
      t.classList.remove("show");
    },2200);
  }

  function openQuickView(p){

    let modal=document.getElementById("cgQuickModal");

            class="cg-modal-close"
            type="button"
            aria-label="Close">
            ×
          </button>

          <div class="cg-modal-content"></div>

        </div>
      `;

      document.body.appendChild(modal);

      modal.querySelector(".cg-modal-backdrop")
        .onclick=()=>closeModal();

      modal.querySelector(".cg-modal-close")
        .onclick=()=>closeModal();
    }

    modal.querySelector(".cg-modal-content").innerHTML=`

      <div class="cg-modal-visual">
        ${gemVisual(p.color)}

            type="button">
            Continue Browsing
          </button>

        </div>

      </div>
    `;

    modal.classList.add("open");

    document.body.classList.add("cg-modal-open");

    modal.querySelector(".cg-modal-close-secondary")
