  background:var(--ivory);
  color:var(--ink);

  font-family:"DM Sans",sans-serif;

  overflow-x:hidden;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

body,
button,
input,
textarea,
select{

}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

button{

  cursor:pointer;
}

a{
  color:inherit;
}

img{
  display:block;
  max-width:100%;
}

iframe{
  display:block;

/* ---------------------------------------------------------
   SELECTION
   --------------------------------------------------------- */

::selection{

}


/* ---------------------------------------------------------
   SCROLLBAR
   --------------------------------------------------------- */

  width:7px;
}

::-webkit-scrollbar-track{

}

::-webkit-scrollbar-thumb{

  border-radius:20px;
}


/* ---------------------------------------------------------
   GLOBAL CONTAINER
   --------------------------------------------------------- */

.cg-container{
  width:min(
    calc(100% - 32px),
    var(--container)
  );

  margin-left:auto;
  margin-right:auto;
}


/* ---------------------------------------------------------
   TOP ANNOUNCEMENT BAR
   --------------------------------------------------------- */

.cg-topbar{

  position:relative;

  width:100%;

  min-height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:

  background:

      #f5dfaa 0%,
      #f7edcf 42%,
      #e5f0e9 100%

  font-size:9px;
  font-weight:700;

  letter-spacing:.16em;
  text-transform:uppercase;

  text-align:center;
}

.cg-topbar-dot{
  display:inline-block;

  width:5px;
  height:5px;

  margin:0 8px;

  border-radius:50%;

  background:var(--emerald);
}


/* ---------------------------------------------------------
   MAIN NAVIGATION
   --------------------------------------------------------- */

.cg-nav{

  position:sticky;
  top:0;

  z-index:1000;

  width:100%;

  background:
    rgba(255,255,255,.88);

  border-bottom:

}

.cg-nav-inner{

    calc(100% - 28px),

  display:flex;
  align-items:center;
  justify-content:space-between;

   LOGO
   --------------------------------------------------------- */

<script>

(function(){

  "use strict";


  /* -------------------------------------------------------
     MOBILE MENU STATE
     ------------------------------------------------------- */

  const menuButton =
    document.querySelector(".cg-menu-btn");


  if(menuButton){

    menuButton.addEventListener(
      "click",
      function(){

        const opened =
          menuButton.getAttribute(
            "aria-expanded"
          ) === "true";

        menuButton.setAttribute(
          "aria-expanded",
          String(!opened)
        );

      }
    );

  }


  /* -------------------------------------------------------
     PREVENT BROKEN HASH JUMPS
     ------------------------------------------------------- */

  document
    .querySelectorAll(
      'a[href^="#"]'
    )
    .forEach(function(link){

      link.addEventListener(
        "click",
        function(event){

          const id =
            link.getAttribute("href");

          if(
            !id ||
            id === "#" ||
            !document.querySelector(id)
          ){
            return;
          }

          event.preventDefault();

          document
            .querySelector(id)
            .scrollIntoView({
              behavior:"smooth",
              block:"start"
            });

        }
      );

    });

})();

</script>

            Tanzanite, Spinel, Opal, Agate and
            naturally expressive collector gems.

          <a
            href="#products"
            class="cg-feature-button">

            <span>↗</span>

      </div>

    </div>

  `;


  /* ---------- INSERT ---------- */

  const hero =
    document.querySelector("#cgHero");

  if(hero){

    hero.insertAdjacentElement(
      "afterend",
      section
    );

  }else{

    document.body.appendChild(section);

  }


  /* ---------- CARD CLICK ---------- */

  section
    .querySelectorAll(".cg-collection-card")
    .forEach(function(card){

      card.addEventListener(
        "click",
        function(){

          const category =
            card.dataset.gemCategory;

          try{

            sessionStorage.setItem(
              "cgSelectedGemCategory",
              category
            );

          }catch(e){}

        }
      );

    });


})();
    </script>
